<body style="display:block">
<div class="login"><div class="box">
  <img src="{% static 'img/Logo.jpeg' %}" alt="AQUOS Unified Operating System">
  <h3>Iniciar sesión</h3>
  {% if form.errors %}<div class="errmsg" role="alert">✖ Usuario o contraseña incorrectos, o el usuario no está activo.</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="f"><label for="id_username">Usuario</label>{{ form.username }}</div>
    <div class="f"><label for="id_password">Contraseña</label>{{ form.password }}</div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn primary" type="submit">Entrar</button>
  </form>
  <div class="hint" style="margin-top:10px">Piloto local. El acceso lo valida el servidor.</div>
</div></div>
</body>
</html>
