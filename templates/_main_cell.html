{% if m %}
<div class="mcell"><div class="mval">{{ m.val }}</div>
  <div class="mlbl">{{ m.lbl }}<span class="tag">{{ m.src }}</span></div>
  {% if m.small %}<div class="mnote">{{ m.small }}</div>{% endif %}
  <div class="mnote">{{ m.meta }}</div>
  <div>{% if m.state == "ok" %}<span class="pill s-ok">✔ En meta</span>{% elif m.state == "bad" %}<span class="pill s-bad">✖ Fuera de meta</span>{% else %}<span class="pill s-no">— Sin dato</span>{% endif %}{% if m.provisional %} <span class="pill s-warn">▲ Provisional</span>{% endif %}</div>
</div>
{% else %}<div class="mcell empty na">Próximamente</div>{% endif %}
